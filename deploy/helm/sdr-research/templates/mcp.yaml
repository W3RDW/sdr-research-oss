{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    {{- include "sdr-research.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sdr-research
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdr-research
        app.kubernetes.io/component: mcp
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.mcp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mcp.service.port }}
          env:
            - name: SDR_API_BASE
              value: "http://{{ .Release.Name }}-api:{{ .Values.api.service.port }}"
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: mcp-token
                  optional: true
          livenessProbe:
            httpGet: {path: /healthz, port: {{ .Values.mcp.service.port }}}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: {{ .Values.mcp.service.port }}}
          {{- with .Values.mcp.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels: {{- include "sdr-research.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app.kubernetes.io/name: sdr-research
    app.kubernetes.io/component: mcp
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: {{ .Values.mcp.service.port }}
{{- end }}
