    metadata:
      labels:
        app.kubernetes.io/name: sdr-research
        app.kubernetes.io/component: rx888-soapy
    spec:
      {{- with .Values.soapy.rx888.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rx888-soapy
          image: "{{ .Values.soapy.rx888.image.repository }}:{{ .Values.soapy.rx888.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.soapy.rx888.image.pullPolicy }}
          securityContext:
            privileged: true
          ports:
            - containerPort: {{ .Values.soapy.rx888.port }}
          volumeMounts:
