# Default values for sdr-research.
# Override these via `helm install -f my-values.yaml` or `--set`.

# ─── Station identity ────────────────────────────────────────────────────
station:
  callsign: N0CALL
  grid: AA00aa
  latitude: 0.0
  longitude: 0.0
  operatorEmail: operator@example.com

# ─── Image references ────────────────────────────────────────────────────
images:
  api:
    repository: ghcr.io/w3rdw/sdr-research-api
    tag: latest
    pullPolicy: IfNotPresent
  ui:
    repository: ghcr.io/w3rdw/sdr-research-ui
    tag: latest
    pullPolicy: IfNotPresent
  unifiedSdr:
    repository: ghcr.io/w3rdw/sdr-research-unified-sdr
    tag: latest
    pullPolicy: IfNotPresent

# ─── PostgreSQL ──────────────────────────────────────────────────────────
# In production prefer an external managed DB; this is a simple in-cluster
# StatefulSet for getting started.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    size: 20Gi
    storageClass: ""    # empty = cluster default
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 1000m, memory: 2Gi}

# Or, if postgres.enabled=false, point at an external DB:
externalDatabase:
  url: ""   # postgresql://user:pass@host:5432/db

# ─── API service ─────────────────────────────────────────────────────────
api:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits:   {cpu: 2000m, memory: 6Gi}
  cors:
    origins: []   # e.g. ["https://sdr.example.com"]
  cache:
    size: 5Gi
  artifacts:
    size: 200Gi
    storageClass: ""
    accessMode: ReadWriteMany   # needed if decoders share the volume

# ─── UI service ──────────────────────────────────────────────────────────
ui:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80

# ─── Ingress ─────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: sdr.example.com
  tls:
    enabled: false
    secretName: ""

# ─── SDR capture ─────────────────────────────────────────────────────────
unifiedSdr:
  enabled: true
  captureId: "2m"
  # Pin to a node with the SDR plugged in. Required.
  nodeSelector: {}     # e.g. { kubernetes.io/hostname: my-sdr-node }
  privileged: true
  hostUsbPath: /dev/bus/usb
  # OSMOSDR_ARGS — see docs/hardware-matrix.md
  osmosdrArgs: "rtl_tcp=rtl-tcp:1234"
  sampleRate: 2400000
  dwellCenterHz: 146000000
  fixedMonitorHz: 146520000
  scanCenters: "[]"
  dwellSec: 60
  scanSec: 5
  rfGain: 40
  ppmCorrection: 0
  squelch:
    rfDb: -50
    openDb: -50
    closeDb: -55
    energyThreshDb: 10
  # Comma-separated ranges. FM bands are preferred over raw FFT bandwidth so
  # quiet repeaters are not filed as CW. Empty cwRecordBands disables CW routing.
  fmRecordBands: "144300000-148000000,150000000-162000000,222000000-225000000,433000000-450000000"
  cwRecordBands: "144000000-144150000,432000000-432100000"
  recording:
    minSec: 0.5
    maxSec: 120
    tailSec: 1.5
  slots:
    fm: 8
    cw: 4
    acars: 0
    frequencyToleranceHz: 2500
    recycleSec: 300

# ─── RepeaterBook (optional) ─────────────────────────────────────────────
# Get a token at https://www.repeaterbook.com/api/token_request.php
repeaterbook:
  enabled: false
  apiKey: ""              # OR provide via existing secret below
  existingSecret: ""      # secret name; key 'repeaterbook-api-key'
  email: operator@example.com
  userAgent: "sdr-research-oss/1.0 (operator@example.com)"
  latitude: 0.0
  longitude: 0.0
  radiusMiles: 75
  states: ""              # e.g. "OH,IN,KY"
  syncHours: 24

# ─── Ollama (optional — local LLM transcript tagging) ───────────────────
# See docs/ollama-setup.md. The chart does NOT install Ollama itself; you
# point it at an existing instance (in-cluster or external).
ollama:
  enabled: false
  url: "http://ollama:11434"
  model: "llama3.1:8b"
  timeoutSeconds: 20
  maxTags: 8
  maxPerCycle: 40

# ─── Alerting (optional webhook) ─────────────────────────────────────────
alerts:
  enabled: false
  callsigns: ""
  keywords: ""
  webhookUrl: ""
  existingSecret: ""      # secret name; key 'alert-webhook-url'

# ─── Optional decoders ───────────────────────────────────────────────────
# Each decoder mounts the same artifacts PVC as unified-sdr + api, so it
# reads from the SDR's /data/audio/ output and writes to /data/text/<type>/
# where the api indexer picks it up.
#
# Per-decoder knobs:
#   enabled       master switch
#   image.{repository,tag,pullPolicy}
#   nodeSelector  pin to a specific node (rare — usually only needed for GPU)
#   tolerations   for tainted nodes
#   resources     k8s resource requests/limits
#   env           map of extra env vars
#   command/args  override the image entrypoint
decoders:
  aprs:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-aprs, tag: "0.1.0"}
  cw:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-cw, tag: "0.1.0"}
  voice:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-voice, tag: "0.1.0"}
    gpu: false               # set true to request nvidia.com/gpu: 1
    whisperModel: base.en    # tiny / base / small / medium / large-v3
    nodeSelector: {}         # e.g. {nvidia.com/gpu.present: "true"}
  pager:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-pager, tag: "0.1.0"}
  eas:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-eas, tag: "0.1.0"}
  sstv:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-sstv, tag: "0.1.0"}
  spectrum-exporter:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-spectrum-exporter, tag: "0.1.0"}
  # acars + vdl2 build acarsdec/dumpvdl2 from source (not in Debian apt). They
  # connect to an Airspy over SoapyRemote. NOTE: acars is unverified end-to-end
  # (upstream acarsdec is archived) — smoke-test before enabling. See the READMEs.
  acars:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-acars, tag: latest}
    env:
      SOAPY_REMOTE: "airspy-soapy:55132"
      ACARS_OUTPUT_DIR: "/data/text/acars"
      ACARS_FREQUENCIES: "129.125 130.025 130.425 130.450 131.125 131.550"
      ACARS_GAIN: "18"
  vdl2:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-vdl2, tag: latest}
    env:
      SOAPY_REMOTE: "airspy-soapy:55132"
      VDL2_OUTPUT_DIR: "/data/text/vdl2"
      VDL2_FREQUENCIES: "136725000 136775000 136800000 136875000 136975000"
      VDL2_GAIN: "18"
  # ─── HF decoders (RX888 over SoapyRemote / direct USB) ───────────────────
  # The RX888 SoapyRemote server is single-client: enabling one of these should
  # be paired with scaling any other RX888 consumer (e.g. OpenWebRX) to 0.
  hfdl:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-hfdl, tag: latest}
    nodeSelector: {}     # pin to the RX888 node
    env:
      SOAPY_REMOTE: "rx888-soapy:55132"
      SOAPY_DEVICE_STRING: "driver=SDDC"
      HFDL_OUTPUT_DIR: "/data/text/hfdl"
      HFDL_FREQUENCIES: "8912 8927 10081 11384 13303"   # kHz (dumphfdl)
  ft8-wspr:
    enabled: false
    # Unified HF decoder: FT8/WSPR + HFDL + SSTV time-shared on one RX888.
    image: {repository: ghcr.io/w3rdw/sdr-research-ft8-wspr, tag: latest}
    privileged: true
    hostUsbPath: /dev/bus/usb
    nodeSelector: {}     # pin to the RX888 node (required)
    resources:
      requests: {cpu: 500m,  memory: 512Mi}
      limits:   {cpu: 3000m, memory: 2Gi}
    env:
      SOAPY_REMOTE: "rx888-soapy:55132"
      SOAPY_DEVICE_STRING: "driver=SDDC"
      FT8_OUTPUT_DIR: "/data/text/ft8"
      FT8_FREQUENCIES: "3573000 7074000 10136000 14074000 18100000 21074000 24915000 28074000"
      WSPR_FREQUENCIES: "7038600 10138700 14095600 21094600 28124600"
      HFDL_ENABLED: "true"
      HFDL_OUTPUT_DIR: "/data/text/hfdl"
      HFDL_FREQUENCIES: "10081 11384"   # kHz
      SSTV_OUTPUT_DIR: "/data/audio/sstv"
  hf-combined:
    enabled: false
    # HFDL + SSTV-HF time-shared on the RX888 (alternative to ft8-wspr).
    image: {repository: ghcr.io/w3rdw/sdr-research-hf-combined, tag: latest}
    privileged: true
    hostUsbPath: /dev/bus/usb
    nodeSelector: {}
    env:
      SOAPY_REMOTE: "rx888-soapy:55132"
      SOAPY_DEVICE_STRING: "driver=SDDC"
      HFDL_OUTPUT_DIR: "/data/text/hfdl"
      HFDL_FREQUENCIES: "10081 11384"
      SSTV_OUTPUT_DIR: "/data/images/sstv"
      HF_SSTV_FREQS: "14230000,21340000,28680000,7171000"
  sstv-hf:
    enabled: false
    # HF SSTV via direct RX888 capture — reuses the sstv image with the HF entrypoint.
    image: {repository: ghcr.io/w3rdw/sdr-research-sstv, tag: latest}
    command: ["python3", "/sstv-hf-entrypoint.py"]
    nodeSelector: {}
    env:
      SOAPY_REMOTE_RX888: "rx888-soapy:55132"
      SSTV_OUTPUT_DIR: "/data/images/sstv"
      HF_SSTV_FREQS: "14230000,21340000,28680000,7171000"

# ─── MCP server (optional — read-only API access for LLM / agent clients) ─
mcp:
  enabled: false
  image: {repository: ghcr.io/w3rdw/sdr-research-mcp, tag: latest, pullPolicy: IfNotPresent}
  replicaCount: 1
  service: {type: ClusterIP, port: 8080}
  token: ""            # bearer token; EMPTY DISABLES AUTH — never expose unauthenticated
  existingSecret: ""   # secret name carrying key 'mcp-token'
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits:   {cpu: 200m, memory: 192Mi}

# ─── Watchdog (optional — k8s auto-recovery supervisor) ──────────────────
# Polls the API radio-status endpoint and rollout-restarts stale decoders.
# NOTE: the watched-deployment list is currently baked into the image
# (unified-sdr, unified-sdr-70cm, ft8-wspr-decoder); align your release name
# or names before relying on auto-restart. Defaults to dry-run (log only).
watchdog:
  enabled: false
  image: {repository: ghcr.io/w3rdw/sdr-research-watchdog, tag: latest, pullPolicy: IfNotPresent}
  dryRun: true
  cycleSeconds: 60
  restartGraceSeconds: 600
  nodeSelector: {}
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits:   {cpu: 200m, memory: 128Mi}

# ─── SoapyRemote front-end servers (optional) ────────────────────────────
# DaemonSets pinned to the node with the physical USB SDR, exposing it over the
# network. Services use FIXED names (airspy-soapy / rx888-soapy) so decoders'
# default SOAPY_REMOTE values resolve. Both default to port 55132.
soapy:
  airspy:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-soapy-airspy, tag: latest, pullPolicy: IfNotPresent}
    port: 55132
    nodeSelector: {}   # REQUIRED — node with the Airspy plugged in
    resources:
      requests: {cpu: 200m, memory: 128Mi}
      limits:   {cpu: 1000m, memory: 512Mi}
  rx888:
    enabled: false
    image: {repository: ghcr.io/w3rdw/sdr-research-soapy-rx888, tag: latest, pullPolicy: IfNotPresent}
    port: 55132
    nodeSelector: {}   # REQUIRED — node with the RX888 plugged in
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits:   {cpu: 1000m, memory: 1Gi}
